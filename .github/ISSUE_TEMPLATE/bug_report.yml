name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: do **not** file them here. See SECURITY.md. Remove secrets and personal data from logs."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Expected vs. actual behaviour"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version / commit}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: "OS, Python, Node, ffmpeg versions"}
  - type: dropdown
    id: providers
    attributes:
      label: Providers in use
      multiple: true
      options: [mock LLM, Ollama, Anthropic, Kokoro, Piper, macOS say, ElevenLabs, static avatar, HeyGen, FFmpeg renderer, Remotion renderer, Docker/n8n]
  - type: textarea
    id: logs
    attributes: {label: Logs, render: shell}
