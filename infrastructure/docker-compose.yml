# Hybrid (default):   make docker-infra-up   -> only postgres + n8n; FastAPI/Next.js/rendering run on the Mac.
# Everything in Docker: make docker-full-up  -> adds the `full` profile (backend, frontend); stop the Mac copies first (ports 8000/3000).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: cyber_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]   # optional host access (psql -p 5433); 5432 is taken by Homebrew Postgres on the Mac
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studio -d cyber_studio"], interval: 10s, retries: 5 }
    networks: [internal]

  backend:
    profiles: ["full"]
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@postgres:5432/cyber_studio
      CORS_ORIGINS: http://localhost:3000
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [studio-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    networks: [internal, web]
    security_opt: ["no-new-privileges:true"]

  n8n:
    build: { context: .., dockerfile: infrastructure/Dockerfile.n8n }
    environment:
      # n8n's own data lives in a dedicated `n8n` database inside the compose Postgres (created idempotently by `make docker-infra-up`).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: studio
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      # n8n >= 1.0 has built-in user management (owner account is created on first visit); basic auth vars are removed.
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"          # http on localhost only; set true behind TLS
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read STUDIO_* via $env
      # Hybrid: FastAPI runs on the Mac. host.docker.internal is Docker Desktop's name for the host; `full` mode overrides to http://backend:8000.
      STUDIO_API_URL: ${STUDIO_API_URL_FOR_N8N:-http://host.docker.internal:8000}
      STUDIO_SERVICE_TOKEN: ${SERVICE_TOKEN}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      STUDIO_DASHBOARD_URL: ${STUDIO_DASHBOARD_URL:-http://localhost:3000}
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n-data:/home/node/.n8n
      - ../automation/workflows:/workflows:ro   # import source; edits take effect without rebuilding
    ports: ["127.0.0.1:5678:5678"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # no-op on Docker Desktop, needed on Linux
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal, web]

  frontend:
    profiles: ["full"]
    build: { context: ../frontend }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    networks: [web]

volumes: { pgdata: {}, studio-data: {}, n8n-data: {} }
networks:
  internal: { internal: false }   # set internal: true to cut egress once you use Ollama/local-only providers
  web: {}
