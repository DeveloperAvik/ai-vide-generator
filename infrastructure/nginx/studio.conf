# Reverse proxy for an Ubuntu VPS. Terminate TLS with certbot; keep n8n behind basic auth / VPN.
server {
  listen 80; server_name studio.example.com;
  client_max_body_size 520m;               # recording uploads (API enforces 500MB)
  location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 300s; }
  location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}
